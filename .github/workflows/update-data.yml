name: Update motorsport data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/**"
      - "tests/**"
  schedule:
    # The decision step normally allows one refresh every six hours. During
    # the post-session window it allows a run every five minutes until the
    # missing classification appears in the published event document.
    # Offset from minute zero to reduce GitHub's peak-hour cron delays. The
    # watcher keeps an admitted job alive across the end of a live session.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-motorsport-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: python -m pip install pdfplumber
      - name: Test adapters
        run: python -m unittest discover -s tests -v
      - name: Watch live sessions and build data
        run: python scripts/watch_live_results.py
      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update motorsport data"
          # A code change may land while this relatively long importer is
          # running. Rebase the data-only commit before pushing so that a
          # harmless concurrent main update does not fail the workflow.
          git fetch origin main
          git rebase origin/main
          git push
