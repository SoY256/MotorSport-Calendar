name: Update motorsport data

on:
  workflow_dispatch:
  schedule:
    # The decision step normally allows one refresh every six hours. During
    # the post-session window it allows a run every five minutes until the
    # missing classification appears in the published event document.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-motorsport-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether data is due
        id: refresh
        run: python scripts/refresh_decision.py >> "$GITHUB_OUTPUT"
      - name: Install importer dependencies
        if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.run == 'true'
        run: python -m pip install pdfplumber
      - name: Test adapters
        if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Build data
        if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.run == 'true'
        run: python scripts/update_all_data.py
      - name: Commit changed data
        if: github.event_name == 'workflow_dispatch' || steps.refresh.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update motorsport data"
          git push
