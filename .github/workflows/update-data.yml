name: Update motorsport data

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year (defaults to current UTC year)
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-motorsport-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test adapters
        run: python -m unittest discover -s tests -v
      - name: Build data
        env:
          REQUESTED_YEAR: ${{ inputs.year }}
        run: |
          if [ -n "$REQUESTED_YEAR" ]; then
            python scripts/fetch_data.py --year "$REQUESTED_YEAR"
          else
            python scripts/fetch_data.py
          fi
      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update motorsport data"
          git push
