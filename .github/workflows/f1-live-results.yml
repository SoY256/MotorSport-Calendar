name: Official F1 live results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_f1_official_results.py'
      - 'scripts/watch_f1_results.py'
      - 'scripts/result_status.py'
      - '.github/workflows/f1-live-results.yml'
  schedule:
    - cron: '1-59/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: official-f1-live-results
  # Deploy code fixes immediately; scheduled runs still hand over without
  # cancelling the lane that is already waiting for live classifications.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  official-results:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued runs start from the newest data, not from the commit that
          # was current when they were scheduled (stale standings).
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber
      - run: python -m unittest discover -s tests -v
      - run: python -u scripts/watch_f1_results.py
        env:
          GH_TOKEN: ${{ github.token }}
