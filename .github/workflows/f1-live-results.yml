name: Official F1 live results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_f1_official_results.py'
      - 'scripts/watch_f1_results.py'
      - '.github/workflows/f1-live-results.yml'
  schedule:
    - cron: '1-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: official-f1-live-results
  cancel-in-progress: false
jobs:
  official-results:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -u scripts/watch_f1_results.py
