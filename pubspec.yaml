name: secar
description: Secar — a modern, multi-series motorsport calendar.
publish_to: "none"
version: 0.1.2+4

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
  assets:
    - assets/data/
    - assets/data/f1/2026/
    - assets/data/f1/2026/events/
    - assets/data/f2/2026/
    - assets/data/f2/2026/events/
    - assets/data/f3/2026/
    - assets/data/f3/2026/events/
    - assets/data/imsa/2026/
    - assets/data/imsa/2026/events/
    - assets/data/indycar/2026/
    - assets/data/indycar/2026/events/
    - assets/data/indynxt/2026/
    - assets/data/indynxt/2026/events/
    - assets/data/wec/2026/
    - assets/data/wec/2026/events/
    - assets/circuits/
    - assets/brands/
    - assets/branding/
    - assets/team_logos/
    - assets/portraits/indycar/
    - assets/portraits/indynxt/
    - assets/portraits/imsa/
    - assets/portraits/faces/imsa/
    - assets/portraits/faces/wec/
    - assets/portraits/faces/indycar/
    - assets/portraits/faces/indynxt/
